name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "features-partner/**"
      - "app-customer/**"
      - "app-merchant/**"
      - "app-courier/**"
      - "app-admin/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "google-services.json"
      - "keystore/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ملف واحد في جذر المستودع يخدم التطبيقات الأربعة (يحوي كل التطبيقات المسجّلة في Firebase)
      - name: Check google-services.json
        run: |
          if [ ! -f google-services.json ]; then
            echo "::error::الملف google-services.json غير موجود في جذر المستودع."
            exit 1
          fi
          missing=0
          for pkg in com.maqdi.customer com.maqdi.merchant com.maqdi.courier com.maqdi.admin; do
            if ! grep -q "\"package_name\": *\"$pkg\"" google-services.json; then
              echo "::error::التطبيق $pkg غير مسجّل في google-services.json. سجّله في Firebase ثم نزّل الملف من جديد."
              missing=1
            fi
          done
          exit $missing
          
      - name: Copy google-services.json into each app
        run: |
          for app in app-customer app-merchant app-courier app-admin; do
            cp google-services.json "$app/google-services.json"
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APKs
        run: gradle :app-customer:assembleDebug :app-merchant:assembleDebug :app-courier:assembleDebug :app-admin:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: maqdi-customer-apk
          path: app-customer/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: maqdi-merchant-apk
          path: app-merchant/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: maqdi-courier-apk
          path: app-courier/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: maqdi-admin-apk
          path: app-admin/build/outputs/apk/debug/*.apk
