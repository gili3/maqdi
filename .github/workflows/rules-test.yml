name: Rules Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "rules-tests/**"
      - ".github/workflows/rules-test.yml"

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install tools
        run: |
          npm install -g firebase-tools
          npm --prefix rules-tests install
      - name: Run rules tests on the Firestore emulator
        run: firebase emulators:exec --only firestore --project demo-maqdi "npm --prefix rules-tests test"
